<body class="bg-temple-ivory text-granite font-body-md min-h-screen flex flex-col antialiased relative pb-[100px]">

<header class="w-full top-0 sticky bg-temple-ivory z-40 border-b border-pandya-gold/10 transition-shadow">
<div class="flex justify-between items-center px-md py-sm h-16 max-w-full mx-auto md:px-margin">

</button>
<h1 class="font-headline-sm text-headline-sm text-granite tracking-tight">My Areas</h1>
<button class="text-granite p-2 rounded-full hover:bg-sandstone/50 active:scale-95 duration-150 transition-colors focus:outline-none">

</button>
</div>
</header>

<!-- List Items Container -->
<div class="flex flex-col gap-3">
<!-- Area Row: Personal -->

<span class="material-symbols-outlined" data-icon="person" data-weight="fill" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<div class="ml-4 flex-1">
<h3 class="font-label-md text-label-md text-granite">Personal Life</h3>
<p class="font-caption text-caption text-stone mt-1">4 open tasks · 12 notes</p>
</div>
<div class="text-pandya-gold/60 group-hover:text-pandya-gold transition-colors">
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</div>
</div>
<!-- Area Row: Work -->
<div class="group flex items-center bg-surface-container-low rounded-xl p-4 shadow-[0_4px_20px_rgba(34,30,26,0.03)] border border-pandya-gold/10 active:scale-[0.98] transition-transform cursor-pointer">

</div>
</div>

</div>
