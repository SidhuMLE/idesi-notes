<style>
        .saved-indicator {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .saved-indicator.show {
            opacity: 1;
        }
        /* Custom scrollbar for webkit to match the aesthetic */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #eae1da; /* surface-variant */
            border-radius: 9999px;
        }
        textarea:focus {
            outline: none;
            box-shadow: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-temple-ivory h-full flex flex-col text-on-surface overflow-hidden">
<!-- TopAppBar (Transactional/Task Focused - BottomNavBar Suppressed) -->
<header class="bg-surface border-b border-outline-variant/20 w-full top-0 sticky flex justify-between items-center px-4 md:px-margin py-sm max-w-full z-10">
<button aria-label="Go back and save" class="text-madder-red p-2 -ml-2 rounded-full hover:bg-surface-variant transition-colors active:scale-95 duration-150 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline-sm text-headline-sm text-primary font-display text-center">Mon 2 Jun 2026</h1>
<span class="font-caption text-caption text-stone saved-indicator" id="saveStatus">Saved</span>
</div>
<button aria-label="More options" class="text-madder-red p-2 -mr-2 rounded-full hover:bg-surface-variant transition-colors active:scale-95 duration-150 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col relative w-full h-full">
<!-- Generous whitespace and full width text area -->
<textarea autofocus="" class="w-full h-full flex-grow bg-transparent border-none resize-none px-4 md:px-8 py-6 font-body-md text-body-md text-granite placeholder:text-stone/60 focus:ring-0 leading-relaxed" id="noteInput" placeholder="Write something…"></textarea>
<!-- Subtle Pandya Gold divider at the very bottom just to anchor the space visually, mimicking a premium notebook spine or edge -->
<div class="h-[1px] w-full bg-pandya-gold/10 absolute bottom-0 left-0"></div>
</main>
<script>
        // Auto-save simulation logic
        const noteInput = document.getElementById('noteInput');
        const saveStatus = document.getElementById('saveStatus');
        let saveTimeout;

        noteInput.addEventListener('input', () => {
            // Hide "Saved" indicator while typing
            saveStatus.classList.remove('show');
            
            // Clear existing timeout
            clearTimeout(saveTimeout);
            
            // Set a new timeout to simulate saving after user stops typing
            saveTimeout = setTimeout(() => {
                // Simulate save complete
                saveStatus.classList.add('show');
                
                // Optionally hide it again after a few seconds
                setTimeout(() => {
                    saveStatus.classList.remove('show');
                }, 3000);
            }, 1000); // 1 second after last keystroke
        });

        // Ensure text area focuses immediately (works better on real devices if triggered by user interaction usually, but good for demo)
        window.addEventListener('DOMContentLoaded', () => {
            noteInput.focus();
        });
    </script>
</body></html>
