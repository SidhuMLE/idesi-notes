<script>
        // Simple interactions script
        document.addEventListener('DOMContentLoaded', () => {
            const areaNameInput = document.getElementById('area-name');
            const saveBtn = document.getElementById('saveBtn');
            const iconBtns = document.querySelectorAll('.icon-btn');
            const colorBtns = document.querySelectorAll('.color-btn');

            // Save button logic
            areaNameInput.addEventListener('input', (e) => {
                if (e.target.value.trim().length > 0) {
                    saveBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'text-stone');
                    saveBtn.classList.add('text-madder-red', 'font-bold', 'hover:bg-sandstone');
                } else {
                    saveBtn.classList.add('opacity-50', 'cursor-not-allowed', 'text-stone');
                    saveBtn.classList.remove('text-madder-red', 'font-bold', 'hover:bg-sandstone');
                }
            });

            // Icon selection logic
            iconBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Reset all
                    iconBtns.forEach(b => {
                        b.classList.remove('border-pandya-gold', 'bg-sandstone', 'text-madder-red');
                        b.classList.add('border-transparent', 'text-granite');
                        const iconSpan = b.querySelector('.material-symbols-outlined');
                        if(iconSpan) iconSpan.style.fontVariationSettings = "'FILL' 0";
                    });
                    
                    // Set active
                    btn.classList.remove('border-transparent', 'text-granite');
                    btn.classList.add('border-pandya-gold', 'bg-sandstone', 'text-madder-red');
                    const iconSpan = btn.querySelector('.material-symbols-outlined');
                    if(iconSpan) iconSpan.style.fontVariationSettings = "'FILL' 1";
                });
            });

            // Color selection logic
            colorBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    colorBtns.forEach(b => b.classList.remove('color-swatch-selected'));
                    btn.classList.add('color-swatch-selected');
                });
            });
        });
    </script>
