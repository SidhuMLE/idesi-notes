name: Release APK

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Tests must pass before we build anything ──────────────────────
  test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set app version from git tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  # ── Job 2: Build APK only after tests pass ───────────────────────────────
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set app version from git tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@8

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Gradle wrapper to 8.13 (Capacitor template ships 8.0.2, AGP requires 8.13+)
        run: sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Disable Android Auto Backup (prevents old data restoring on reinstall)
        run: |
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup' android/app/src/main/AndroidManifest.xml || \
            sed -i 's/<application/<application android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml

      - name: Generate app icons
        run: node scripts/generate-icons.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Kotlin stdlib duplicate classes
        run: |
          cat >> android/build.gradle << 'EOF'

          // kotlin-stdlib 1.8+ absorbs jdk7/jdk8 — exclude the old split JARs
          subprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > $GITHUB_WORKSPACE/keystore.jks

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: idesi-notes-${{ github.ref_name }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
